name: Documentation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bilingual-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate bilingual documentation
        run: python scripts/check_bilingual_docs.py
